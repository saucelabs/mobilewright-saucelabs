name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Mobilewright release that breaks the driver shows up here before users hit it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  latest-mobilewright:
    name: Unit (latest Mobilewright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # A new required protocol method (like clearAppData in 0.0.66) fails the type check here.
      - run: npm install --no-save mobilewright@latest @mobilewright/protocol@latest
      # Shows the versions under test; it reports them as "invalid" when they're outside package.json's range.
      - run: npm ls mobilewright @mobilewright/protocol || true
      - run: npm run lint
      - run: npm run build
      - run: npm test
