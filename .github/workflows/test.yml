name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/unit-node-${{ matrix.node }}.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-unit-node-${{ matrix.node }}
          path: results/
          if-no-files-found: ignore

  results:
    name: Results
    # After every job, also when some failed; the summary is at the bottom of the run's page.
    needs: [unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'results-*'
          path: artifacts
      - uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: artifacts/**/*.xml
          check_name: Unit test results
          # Only the run's summary page: no check run or pull request comment, so no write permissions needed.
          check_run: false
          comment_mode: off
